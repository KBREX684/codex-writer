[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "codex-writer"
version = "0.1.0"
description = "Codex Writer MVP - 中文长篇网文创作插件与本地运行时"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "filelock>=3.13",
]
license = {text = "MIT"}

[project.optional-dependencies]
openai = ["httpx>=0.27"]
dev = ["pytest>=7.0"]

[project.scripts]
codex-writer = "codex_writer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
